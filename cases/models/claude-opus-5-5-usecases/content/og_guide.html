<style>
:root{
  --ink:#241E1E; --green:#238653; --green-deep:#176A42; --lime:#C9DF8D; --lilac:#EAD8EB;
  --purple:#AD85BA; --blue:#103CA0; --paper:#FFFFFF; --ink-2:#5d5656; --lim:#b0203a;
  --cn:'Noto Sans CJK SC',sans-serif;
  --disp:'Figtree','Noto Sans CJK SC',sans-serif;
  --mono:'Roboto Mono','Noto Sans CJK SC',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--ink)}
body{position:relative;color:var(--ink);font-family:var(--cn);font-synthesis:none;-webkit-font-smoothing:antialiased}

.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(234,216,235,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(234,216,235,.09) 1px,transparent 1px);background-size:16px 16px}
.panel{position:absolute;left:285px;top:0;width:630px;height:390px;background:var(--paper)}
.frame{position:absolute;inset:12px;border:3px solid var(--lime)}

.mid{position:absolute;left:285px;top:0;width:630px;height:390px;text-align:center}
.mid>*{position:absolute;left:0;right:0}
.logo{top:32px;height:34px;display:flex;justify-content:center}
.logo svg{height:34px;width:auto;display:block}
.t1{top:100px;white-space:nowrap}
.chip{display:inline-block;position:relative;padding:.02em .22em .07em;border:2.5px solid var(--ink);background:var(--green);color:var(--paper);
  font:800 74px/1.04 var(--disp);letter-spacing:-.03em;transform:rotate(-2deg)}
.chip::before,.chip::after{content:"";position:absolute;width:15px;height:15px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
.chip::before{left:-9px;top:-9px}.chip::after{right:-9px;bottom:-9px}
h1{top:200px;font:700 98px/1 var(--cn);letter-spacing:-.01em;white-space:nowrap}
.sub{top:320px;display:flex;justify-content:center}
.sub p{position:relative;display:inline-block;white-space:nowrap;background:var(--lilac);border:2.5px solid var(--ink);padding:5px 18px 7px;font:700 30px/1.2 var(--cn);transform:rotate(-1.2deg)}
.sub p::before,.sub p::after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink)}
.sub p::before{left:-8px;top:-8px}.sub p::after{right:-8px;bottom:-8px}
.sub b{font:800 32px/1 var(--disp);color:var(--green-deep)}

/* side stickers: guide tag (left), sources count (right) */
.sk{position:absolute;background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.sk .kk{display:block;font:500 15px/1 var(--mono);letter-spacing:.14em;color:var(--ink-2);margin-bottom:12px}
.src{left:938px;top:56px;width:236px;padding:18px 18px 22px;background:var(--lime);transform:rotate(2deg)}
.src .n{display:flex;align-items:baseline;gap:6px}
.src .n b{font:800 104px/.86 var(--disp);letter-spacing:-.04em}
.src .n span{font:700 34px/1 var(--cn)}
.src p{font:700 30px/1.25 var(--cn);margin-top:12px;white-space:nowrap}
.tag{left:28px;top:56px;width:236px;transform:rotate(-2deg)}
.tag .th{height:42px;display:flex;align-items:center;padding:0 16px;border-bottom:2px solid var(--ink);font:500 15px/1 var(--mono);letter-spacing:.14em;color:var(--ink-2);white-space:nowrap;
  background-color:var(--lilac);background-image:linear-gradient(rgba(36,30,30,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(36,30,30,.08) 1px,transparent 1px);background-size:12px 12px}
.tag p{margin:14px 18px 0;font:700 74px/1.06 var(--cn);letter-spacing:.02em;white-space:nowrap;padding-bottom:12px;border-bottom:3px solid var(--blue)}
.tag .dt{display:block;margin:12px 18px 15px;font:500 16px/1 var(--mono);letter-spacing:.14em;color:var(--ink-2);white-space:nowrap}

/* route + step chips (01-02 green: claude.ai; 03-04 blue: Claude Code; 05 red: pitfalls, as in the guide's route figure) */
.route{position:absolute;left:12px;right:12px;top:470px;height:0;border-top:4px dashed var(--lime)}
.steps{position:absolute;left:24px;right:24px;top:422px;display:flex;justify-content:space-between;align-items:flex-start}
.st{display:flex;align-items:stretch;background:var(--paper);border:2px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.4)}
.st .no{flex:none;width:46px;display:flex;justify-content:center;padding-top:14px;color:var(--paper);background:var(--green);border-right:2px solid var(--ink);font:700 22px/1 var(--mono)}
.st h3{font:700 26px/1.3 var(--cn);padding:12px 14px 14px 12px;white-space:nowrap;min-height:92px}
.ar{flex:none;width:0;height:0;margin-top:43px;border-left:11px solid var(--lime);border-top:8px solid transparent;border-bottom:8px solid transparent;position:relative;left:2px}
.st.b .no{background:var(--blue)}.st.r .no{background:var(--lim)}
.st:nth-of-type(1){transform:rotate(-1.6deg)}
.st:nth-of-type(2){transform:rotate(1.2deg)}
.st:nth-of-type(3){transform:rotate(-1deg)}
.st:nth-of-type(4){transform:rotate(1.4deg)}
.st:nth-of-type(5){transform:rotate(-1.4deg)}

.en{position:absolute;left:285px;width:630px;top:566px;text-align:center;font:600 26px/1 var(--disp);color:var(--paper);white-space:nowrap}
</style>
</head>
