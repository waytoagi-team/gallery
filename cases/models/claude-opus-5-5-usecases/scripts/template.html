<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opus 5.5 Use Cases</title>
<meta name="description" content="Claude Opus 5.5 公开使用案例合集：来自 X、GitHub、Hacker News 与网页的案例。">
<style>
:root{
  --bg:#f6f4ef; --surface:#fffdf9; --surface-2:#efebe3; --ink:#1d1b18; --ink-2:#5a554c; --ink-3:#8b857a;
  --line:#e2ddd2; --accent:#c2562f; --accent-soft:#f5e3d9; --focus:#2f6fc2;
  --ev-demo:#3d7a52; --ev-eval:#2f6fc2; --ev-int:#7a4fb0; --ev-tut:#a07a12; --ev-lim:#b23b3b;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 4px 16px rgba(40,30,10,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151412; --surface:#1e1c19; --surface-2:#282521; --ink:#eeeae2; --ink-2:#b4ada1; --ink-3:#847d71;
  --line:#34302a; --accent:#e27b52; --accent-soft:#3a261c; --focus:#6fa4ea;
  --ev-demo:#72b98a; --ev-eval:#6fa4ea; --ev-int:#b391e0; --ev-tut:#d8b24a; --ev-lim:#e57878;
  --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#151412; --surface:#1e1c19; --surface-2:#282521; --ink:#eeeae2; --ink-2:#b4ada1; --ink-3:#847d71;
  --line:#34302a; --accent:#e27b52; --accent-soft:#3a261c; --focus:#6fa4ea;
  --ev-demo:#72b98a; --ev-eval:#6fa4ea; --ev-int:#b391e0; --ev-tut:#d8b24a; --ev-lim:#e57878;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}
header.top{padding:40px 0 24px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(28px,5vw,48px)/1.1 ui-serif,Georgia,"Songti SC",serif;margin:10px 0 12px;letter-spacing:-.01em}
.lede{color:var(--ink-2);max-width:760px;margin:0}
.lede a{color:var(--accent)}
.toolbar-top{display:flex;gap:8px;position:absolute;right:16px;top:16px}
.pill-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
.pill-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:24px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat b{display:block;font:700 26px/1.1 ui-serif,Georgia,serif;font-variant-numeric:tabular-nums}
.stat span{color:var(--ink-3);font-size:12px}
section.overview{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;padding:28px 0;border-bottom:1px solid var(--line)}
@media (max-width:820px){section.overview{grid-template-columns:1fr}}
h2{font:600 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px}
.bars{display:flex;flex-direction:column;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 44px;align-items:center;gap:10px;background:none;border:0;padding:4px 6px;border-radius:6px;cursor:pointer;text-align:left}
.bar:hover{background:var(--surface-2)}
.bar[aria-pressed="true"]{background:var(--accent-soft)}
.bar .lbl{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar .n{font:12px ui-monospace,Menlo,monospace;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.highlights{display:flex;flex-direction:column;gap:8px}
.hl{display:flex;gap:10px;align-items:baseline;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;text-decoration:none}
.hl:hover{border-color:var(--accent)}
.hl .rk{font:700 13px ui-monospace,Menlo,monospace;color:var(--accent);min-width:22px}
.hl .t{font-size:14px;flex:1;min-width:0}
.hl .m{font:12px ui-monospace,Menlo,monospace;color:var(--ink-3);white-space:nowrap}
.controls{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 0}
.controls .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.controls .row+.row{margin-top:8px}
.search{flex:1 1 260px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.count{color:var(--ink-3);font-size:13px;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:18px 0 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.thumb{aspect-ratio:16/9;background:var(--surface-2);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 7px;border-radius:4px}
.thumb.src{display:flex;align-items:center;justify-content:center;font:700 22px ui-serif,Georgia,serif;color:var(--ink-3);aspect-ratio:auto;height:56px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--surface) 8px 16px)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.ev{font-weight:600;padding:1px 7px;border-radius:4px;border:1px solid currentColor}
.ev[data-ev="演示"]{color:var(--ev-demo)}.ev[data-ev="评测"]{color:var(--ev-eval)}.ev[data-ev="集成"]{color:var(--ev-int)}.ev[data-ev="教程"]{color:var(--ev-tut)}.ev[data-ev="限制"]{color:var(--ev-lim)}
.plat{background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:4px;font-weight:600}
.card h3{font-size:16px;line-height:1.35;margin:2px 0 0}
.card p{margin:0;color:var(--ink-2);font-size:13.5px}
.foot{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--ink-3);border-top:1px dashed var(--line)}
.foot a{min-width:0;color:var(--accent);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot a:hover{text-decoration:underline}
.nums{font-family:ui-monospace,Menlo,monospace;white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{grid-column:1/-1;text-align:center;color:var(--ink-3);padding:60px 0}
#sentinel{height:1px}
footer{border-top:1px solid var(--line);padding:24px 0 48px;color:var(--ink-3);font-size:13px}
@media (max-width:600px){.bar{grid-template-columns:minmax(0,110px) minmax(0,1fr) 38px}.toolbar-top{position:static;margin-bottom:12px}header.top{padding-top:16px}}
</style>
</head>
<body>
<div class="wrap" style="position:relative">
  <div class="toolbar-top">
    <button class="pill-btn" id="langBtn" type="button">EN</button>
    <button class="pill-btn" id="themeBtn" type="button" aria-label="Toggle theme">◐</button>
  </div>
  <header class="top">
    <div class="eyebrow" data-i18n="eyebrow"></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n-html="lede"></p>
    <div class="stats" id="stats"></div>
  </header>
  <section class="overview">
    <div><h2 data-i18n="byCat"></h2><div class="bars" id="bars"></div></div>
    <div><h2 data-i18n="top"></h2><div class="highlights" id="highlights"></div></div>
  </section>
</div>
<div class="controls">
  <div class="wrap">
    <div class="row">
      <input class="search" id="q" type="search" autocomplete="off">
      <select id="sort">
        <option value="default"></option><option value="likes"></option><option value="bookmarks"></option>
        <option value="new"></option><option value="old"></option>
      </select>
      <select id="ev"></select>
    </div>
    <div class="row"><div class="chips" id="srcChips"></div><span class="count" id="count"></span></div>
  </div>
</div>
<main class="wrap"><div class="grid" id="grid"></div><div id="sentinel"></div></main>
<footer class="wrap" data-i18n-html="footer"></footer>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('data').textContent);
  const CASES = DATA.cases, CATS = DATA.meta.categories;
  const EVS = ['演示','评测','集成','教程','限制'];
  const EV_EN = {'演示':'Demo','评测':'Evaluation','集成':'Integration','教程':'Tutorial','限制':'Limitation'};
  const SRC = {x:{zh:'X',en:'X'}, github:{zh:'GitHub',en:'GitHub'}, hn:{zh:'Hacker News',en:'Hacker News'}, web:{zh:'Web / 博客 / 媒体',en:'Web / blogs / news'}};
  const T = {
    zh:{eyebrow:'Claude Opus 5.5 · Use Case Atlas', h1:'Opus 5.5 使用案例合集',
      lede:`Claude Opus 5.5 发布后，X、GitHub、Hacker News 与网页（官方、博客、媒体、社区）上的公开使用案例。案例描述保留作者自述与推广属性，数量不等于独立成功项目数。`,
      byCat:'按任务类别（点击筛选）', top:'点赞最多', search:'搜索标题、描述、作者…', all:'全部',
      sort:{default:'默认顺序',likes:'点赞 ↓',bookmarks:'收藏 ↓',new:'时间：新→旧',old:'时间：旧→新'}, evAll:'全部证据类型',
      stats:['案例总数','任务类别','来自 X','其他渠道','X 总点赞'], shown:n=>`${n} 个案例`, empty:'没有匹配的案例', open:'原帖 ↗',
      footer:'WaytoAGI Gallery · 所有链接指向原始出处，请以原帖为准。'},
    en:{eyebrow:'Claude Opus 5.5 · Use Case Atlas', h1:'Opus 5.5 Use Cases',
      lede:`Public Claude Opus 5.5 use cases from X, GitHub, Hacker News and the open web (official posts, blogs, news, communities). Descriptions keep authors' own claims and promo disclosures; case count ≠ independent successes.`,
      byCat:'By task category (click to filter)', top:'Most liked', search:'Search titles, summaries, authors…', all:'All',
      sort:{default:'Default order',likes:'Likes ↓',bookmarks:'Bookmarks ↓',new:'Newest first',old:'Oldest first'}, evAll:'All evidence types',
      stats:['Total cases','Categories','From X','Other sources','Total X likes'], shown:n=>`${n} cases`, empty:'No matching cases', open:'Source ↗',
      footer:'WaytoAGI Gallery · All links point to the original sources.'}
  };
  const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };
  const st = {lang: store.get('lang') || 'zh', q:'', cat:null, src:null, ev:'', sort:'default', shown:0};
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = n => n >= 10000 ? (n/1000).toFixed(1)+'k' : (n ?? 0).toLocaleString();
  const L = () => T[st.lang];
  const tt = c => st.lang === 'en' ? (c.title_en || c.title) : c.title;
  const ts = c => st.lang === 'en' ? (c.summary_en || c.summary) : c.summary;
  CASES.forEach((c, i) => { c._i = i; c._hay = [c.title,c.title_en,c.summary,c.summary_en,c.author,c.platform].join(' ').toLowerCase(); });

  const theme = store.get('theme'); if (theme) document.documentElement.dataset.theme = theme;
  $('#themeBtn').onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', document.documentElement.dataset.theme);
  };
  $('#langBtn').onclick = () => { st.lang = st.lang === 'zh' ? 'en' : 'zh'; store.set('lang', st.lang); renderStatic(); render(); };

  function filtered(ignore) {
    const q = st.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    return CASES.filter(c => (ignore === 'cat' || !st.cat || c.category === st.cat)
      && (ignore === 'src' || !st.src || c.source === st.src)
      && (!st.ev || c.evidenceType === st.ev)
      && q.every(w => c._hay.includes(w)));
  }
  function sorted(list) {
    const k = st.sort, d = c => c.date || '';
    if (k === 'likes') return list.slice().sort((a,b) => ((b.likes??b.stars??-1) - (a.likes??a.stars??-1)));
    if (k === 'bookmarks') return list.slice().sort((a,b) => ((b.bookmarks??-1) - (a.bookmarks??-1)));
    if (k === 'new') return list.slice().sort((a,b) => d(b).localeCompare(d(a)) || a._i - b._i);
    if (k === 'old') return list.slice().sort((a,b) => (d(a)||'9').localeCompare(d(b)||'9') || a._i - b._i);
    return list;
  }

  function renderStatic() {
    document.documentElement.lang = st.lang === 'zh' ? 'zh-CN' : 'en';
    $('#langBtn').textContent = st.lang === 'zh' ? 'EN' : '中文';
    document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = L()[e.dataset.i18n]);
    document.querySelectorAll('[data-i18n-html]').forEach(e => e.innerHTML = L()[e.dataset.i18nHtml]);
    $('#q').placeholder = L().search;
    [...$('#sort').options].forEach(o => o.textContent = L().sort[o.value]);
    $('#ev').innerHTML = `<option value="">${L().evAll}</option>` + EVS.map(e => `<option value="${e}">${st.lang==='en'?EV_EN[e]:e} (${CASES.filter(c=>c.evidenceType===e).length})</option>`).join('');
    $('#ev').value = st.ev;
    const base = CASES.filter(c => c.source === 'x').length;
    const likes = CASES.reduce((s,c) => s + (c.likes||0), 0);
    const vals = [CASES.length, Object.keys(CATS).length, base, CASES.length - base, fmt(likes)];
    $('#stats').innerHTML = vals.map((v,i) => `<div class="stat"><b>${typeof v==='number'?v.toLocaleString():v}</b><span>${L().stats[i]}</span></div>`).join('');
    const hl = CASES.filter(c => c.likes).sort((a,b) => b.likes - a.likes).slice(0, 8);
    $('#highlights').innerHTML = hl.map((c,i) => `<a class="hl" href="${esc(c.sourceUrl)}" target="_blank" rel="noopener"><span class="rk">${String(i+1).padStart(2,'0')}</span><span class="t">${esc(tt(c))}</span><span class="m">♥ ${fmt(c.likes)}</span></a>`).join('');
  }

  function renderFilters() {
    const forCat = filtered('cat'), max = Math.max(1, ...Object.keys(CATS).map(k => forCat.filter(c => c.category===k).length));
    const counts = Object.keys(CATS).map(k => [k, forCat.filter(c => c.category===k).length]).sort((a,b) => b[1]-a[1]);
    $('#bars').innerHTML = counts.map(([k,n]) => `<button class="bar" type="button" data-cat="${k}" aria-pressed="${st.cat===k}"><span class="lbl">${esc(CATS[k][st.lang])}</span><span class="track"><span class="fill" style="width:${(n/max*100).toFixed(1)}%"></span></span><span class="n">${n}</span></button>`).join('');
    const forSrc = filtered('src');
    const srcs = Object.keys(SRC).filter(s => CASES.some(c => c.source === s));
    const catChip = st.cat ? `<button class="chip" type="button" data-clearcat aria-pressed="true">${esc(CATS[st.cat][st.lang])} ✕</button>` : '';
    $('#srcChips').innerHTML = catChip + `<button class="chip" type="button" data-src="" aria-pressed="${!st.src}">${L().all}<small>${forSrc.length}</small></button>` +
      srcs.map(s => `<button class="chip" type="button" data-src="${s}" aria-pressed="${st.src===s}">${SRC[s][st.lang]}<small>${forSrc.filter(c=>c.source===s).length}</small></button>`).join('');
  }

  let LIST = [];
  function card(c) {
    const cat = CATS[c.category]?.[st.lang] || c.category;
    const thumb = c.poster
      ? `<div class="thumb"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(c.poster)}" alt="" onerror="this.parentNode.remove()">${c.mediaKind==='video'?'<span class="play">▶ video</span>':''}</div>`
      : `<div class="thumb src">${esc(c.platform)}</div>`;
    const nums = [c.likes!=null?`♥ ${fmt(c.likes)}`:'', c.bookmarks!=null?`⚑ ${fmt(c.bookmarks)}`:'', c.stars!=null?`★ ${fmt(c.stars)}`:''].filter(Boolean).join(' · ');
    return `<article class="card">${thumb}<div class="body">
      <div class="meta"><span class="ev" data-ev="${esc(c.evidenceType)}">${esc(st.lang==='en'?c.evidenceType_en:c.evidenceType)}</span><span>${esc(cat)}</span>${c.date?`<span>· ${esc(c.date)}</span>`:''}</div>
      <h3>${esc(tt(c))}</h3><p>${esc(ts(c))}</p>
      <div class="foot"><a href="${esc(c.sourceUrl)}" target="_blank" rel="noopener" title="${L().open}">${esc(c.author || L().open)}</a><span class="nums">${nums}</span></div>
    </div></article>`;
  }
  function more() {
    const next = LIST.slice(st.shown, st.shown + 48);
    if (!next.length) return;
    $('#grid').insertAdjacentHTML('beforeend', next.map(card).join(''));
    st.shown += next.length;
  }
  function render() {
    renderFilters();
    LIST = sorted(filtered());
    $('#count').textContent = L().shown(LIST.length);
    $('#grid').innerHTML = LIST.length ? '' : `<div class="empty">${L().empty}</div>`;
    st.shown = 0; more();
  }

  $('#bars').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; st.cat = st.cat === b.dataset.cat ? null : b.dataset.cat; render(); };
  $('#srcChips').onclick = e => {
    if (e.target.closest('[data-clearcat]')) { st.cat = null; return render(); }
    const b = e.target.closest('[data-src]'); if (!b) return; st.src = b.dataset.src || null; render();
  };
  let tmr; $('#q').oninput = e => { clearTimeout(tmr); tmr = setTimeout(() => { st.q = e.target.value; render(); }, 150); };
  $('#sort').onchange = e => { st.sort = e.target.value; render(); };
  $('#ev').onchange = e => { st.ev = e.target.value; render(); };
  new IntersectionObserver(es => es[0].isIntersecting && more(), {rootMargin: '800px'}).observe($('#sentinel'));

  renderStatic(); render();
})();
</script>
</body>
</html>
