name: atlas-validate
on:
  pull_request:
    paths: ["atlas/**", "tests/**", "cases/**", "requirements-dev.txt", ".github/workflows/validate.yml"]
  push:
    branches: [main]
    paths: ["atlas/**", "tests/**", "cases/**", "requirements-dev.txt", ".github/workflows/validate.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/test_ranking.cjs
      # Shared changes must rebuild every topic. At two topics, checking both on
      # each PR is cheap and catches cross-topic regressions without path heuristics.
      - run: python -m atlas build --all --check
      - run: python -m atlas.smoke --all --report .cache/validation/browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-validation
          path: .cache/validation/
          retention-days: 14
