<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>{{MODEL_NAME}} Use Case Atlas</title>
<style>
*{box-sizing:border-box}body{margin:0;width:1200px;height:630px;background:#f7f5eb;color:#151515;font-family:Arial,"Noto Sans CJK SC",sans-serif;padding:58px 70px;border-top:14px solid #a1ed48}
.kicker{font:18px monospace;letter-spacing:2px}.line{height:2px;background:#151515;margin:32px 0}h1{font-size:76px;line-height:1.05;letter-spacing:-3px;margin:40px 0 20px}.chip{display:inline-block;padding:8px 18px;background:#c8b7f7;border:2px solid;font-size:23px;transform:rotate(-2deg)}.row{display:flex;align-items:baseline;gap:24px;margin-top:35px}.count{font-size:88px;font-weight:800}.note{font-size:25px}.foot{display:flex;justify-content:space-between;font-size:17px;margin-top:30px}.muted{color:#555}
</style>
<body><div class="kicker">WAYTOAGI GALLERY / USE CASE ATLAS</div>
<h1>{{MODEL_NAME}}</h1><span class="chip">真实案例 · 使用图谱</span>
<div class="row"><span class="count">{{COUNT}}</span><span class="note">条公开案例</span><span class="note muted">{{CARD_STATUS}}</span></div>
<div class="line"></div><div class="foot"><span>{{CATEGORIES}} 类任务 · {{SOURCES}} 个来源 · {{LIMITS}} 条限制</span><span>最新案例日期 {{AS_OF}}</span></div>
</body></html>
